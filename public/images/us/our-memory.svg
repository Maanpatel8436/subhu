<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="mem-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1024" />
      <stop offset="50%" stop-color="#141E3D" />
      <stop offset="100%" stop-color="#1E1938" />
    </linearGradient>
    <radialGradient id="mem-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#F0BFD0" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#C8B7F0" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0A1024" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#mem-bg)" />
  <circle cx="600" cy="380" r="380" fill="url(#mem-glow)" />

  <!-- Stars -->
  <circle cx="200" cy="150" r="2.5" fill="#FFF8F2" opacity="0.7" />
  <circle cx="950" cy="180" r="2" fill="#C8B7F0" opacity="0.8" />
  <circle cx="320" cy="620" r="2" fill="#F0BFD0" opacity="0.6" />
  <circle cx="880" cy="590" r="2.5" fill="#E6E8F0" opacity="0.7" />
  <circle cx="600" cy="120" r="1.5" fill="#FFF8F2" opacity="0.8" />

  <!-- Decorative Inner Frame -->
  <rect x="50" y="50" width="1100" height="700" rx="20" fill="none" stroke="#C8B7F0" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="10 8" />

  <!-- Center Heart & Icon -->
  <circle cx="600" cy="320" r="70" fill="#C8B7F0" fill-opacity="0.08" stroke="#F0BFD0" stroke-width="1.5" stroke-opacity="0.5" />
  <text x="600" y="340" font-family="'Great Vibes', Georgia, serif" font-size="60" fill="#F0BFD0" text-anchor="middle">❤️</text>

  <!-- Titles -->
  <text x="600" y="450" font-family="'Cormorant Garamond', Georgia, serif" font-size="38" font-weight="300" fill="#FFF8F2" text-anchor="middle" letter-spacing="2">One of My Favourite Memories</text>
  <text x="600" y="500" font-family="'DM Sans', sans-serif" font-size="16" fill="#C8B7F0" text-anchor="middle" letter-spacing="3" opacity="0.9">READY FOR YOUR SHARED PHOTO</text>
  <text x="600" y="540" font-family="monospace" font-size="16" fill="#E6E8F0" text-anchor="middle" opacity="0.65">public/images/us/our-memory.jpg</text>
  <text x="600" y="610" font-family="'Great Vibes', Georgia, serif" font-size="30" fill="#F0BFD0" text-anchor="middle" opacity="0.85">"Some moments are simple, but somehow they stay with us a little longer."</text>
</svg>